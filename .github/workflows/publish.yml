name: Publish Rongrong site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website files
        uses: actions/checkout@v4
      - name: Prepare static website (no repository writes)
        run: |
          set -eu
          test -s index.html
          test -s preview.html
          test -s assets.bundle.js
          mkdir -p site/docs/showcase
          cp index.html preview.html assets.bundle.js site/
          if compgen -G 'docs/showcase/*.jpg' > /dev/null; then
            cp docs/showcase/*.jpg site/docs/showcase/
          fi
          touch site/.nojekyll
          echo "Website files prepared:"
          du -sh site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
